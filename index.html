<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>업무현황</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #FFFFFF;
      font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      font-size: 12px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
    }

    thead tr th {
      background-color: #F2F2F2;
      border: 1px solid #D0D0D0;
      padding: 3px 6px;
      text-align: right;
      font-weight: normal;
      white-space: nowrap;
    }

    thead tr th:first-child {
      text-align: left;
    }

    thead tr th:last-child {
      text-align: center;
    }

    tbody tr td {
      background-color: #FFFFFF;
      border: 1px solid #D0D0D0;
      padding: 3px 6px;
      text-align: right;
    }

    tbody tr td:first-child {
      text-align: left;
    }

    tbody tr td:last-child {
      text-align: center;
    }

    tr.summary-row td {
      background-color: #F9F9F9;
      font-weight: bold;
      border: 1px solid #D0D0D0;
      padding: 3px 6px;
      text-align: right;
    }

    tr.summary-row td:first-child {
      text-align: left;
    }

    tr.summary-row td:last-child {
      text-align: center;
    }

    #btn-add-wrap {
      margin-top: 6px;
    }

    #btn-add {
      background: none;
      border: 1px solid #B0B0B0;
      color: #444444;
      font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      font-size: 12px;
      padding: 3px 10px;
      cursor: pointer;
    }

    #btn-add:hover {
      background-color: #F2F2F2;
    }
  </style>
</head>
<body>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Code</th>
        <th>Current</th>
        <th>Change</th>
        <th>Avg.Cost</th>
        <th>Qty</th>
        <th>Value</th>
        <th>P&amp;L</th>
        <th>Return</th>
        <th>Edit</th>
      </tr>
    </thead>
    <tbody id="summary-body"></tbody>
    <tbody id="holdings-body"></tbody>
  </table>

  <div id="btn-add-wrap">
    <button id="btn-add">+ 종목 추가</button>
  </div>

  <script>
    const STORAGE_KEY = 'stock_monitor_holdings';
    const MAX_HOLDINGS = 10;

    // holdings 배열: [{code, quantity, avgPrice}]
    let holdings = [];

    function saveHoldings() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(holdings));
    }

    function loadHoldings() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        try {
          holdings = JSON.parse(raw);
        } catch (e) {
          holdings = [];
        }
      } else {
        holdings = [];
      }
    }

    function formatNumber(n) {
      return n.toLocaleString('ko-KR');
    }

    function getPnlColor(value) {
      if (value > 0) return '#C51F2A';
      if (value < 0) return '#002452';
      return '#000000';
    }

    function renderSummary() {
      const tbody = document.getElementById('summary-body');

      const totalCost = holdings.reduce(function(acc, h) {
        return acc + h.avgPrice * h.quantity;
      }, 0);

      const costText = totalCost > 0 ? formatNumber(totalCost) : '';

      tbody.innerHTML =
        '<tr class="summary-row">' +
          '<td></td>' +
          '<td></td>' +
          '<td></td>' +
          '<td></td>' +
          '<td style="color:#000000">' + costText + '</td>' +
          '<td></td>' +
          '<td></td>' +
          '<td></td>' +
          '<td></td>' +
          '<td></td>' +
        '</tr>';
    }

    function renderRows() {
      const tbody = document.getElementById('holdings-body');
      tbody.innerHTML = '';

      holdings.forEach(function(h) {
        const tr = document.createElement('tr');
        tr.innerHTML =
          '<td></td>' +
          '<td>' + h.code + '</td>' +
          '<td>-</td>' +
          '<td>-</td>' +
          '<td>' + formatNumber(h.avgPrice) + '</td>' +
          '<td>' + formatNumber(h.quantity) + '</td>' +
          '<td></td>' +
          '<td></td>' +
          '<td></td>' +
          '<td></td>';
        tbody.appendChild(tr);
      });
    }

    function renderAddButton() {
      const wrap = document.getElementById('btn-add-wrap');
      wrap.style.display = holdings.length < MAX_HOLDINGS ? '' : 'none';
    }

    function renderTable() {
      renderSummary();
      renderRows();
      renderAddButton();
    }

    document.getElementById('btn-add').addEventListener('click', function() {
      if (holdings.length >= MAX_HOLDINGS) return;
      // 추가 로직은 이후 단계에서 구현
    });

    loadHoldings();
    renderTable();
  </script>
</body>
</html>
