<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>업무현황</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #FFFFFF;
      font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      font-size: 12px;
      padding: 8px;
      overflow-x: auto;
    }

    /* ── 테이블 기본 ── */
    table { border-collapse: collapse; min-width: 800px; }

    thead tr th {
      background-color: #E0E0E0; /* [2] #F2F2F2 → #E0E0E0 */
      border: 1px solid #D0D0D0;
      padding: 3px 6px;
      text-align: right;
      font-weight: normal;
      white-space: nowrap;
    }
    thead tr th:first-child { text-align: left; }
    thead tr th:last-child  { text-align: center; }

    /* ── 일반 행 ── */
    tbody#holdings-body tr:not(.edit-row) td {
      background-color: #FFFFFF;
      border: 1px solid #D0D0D0;
      padding: 3px 6px;
      text-align: right;
      white-space: nowrap;
    }
    tbody#holdings-body tr:not(.edit-row) td:first-child { text-align: left; }
    tbody#holdings-body tr:not(.edit-row) td:last-child  { text-align: center; }

    tbody#holdings-body tr:not(.edit-row):hover td {
      background-color: #EEF0F2;
    }

    /* ── summary 행 (hover 없음) ── */
    tr.summary-row td {
      background-color: #F9F9F9;
      font-weight: bold;
      border: 1px solid #D0D0D0;
      padding: 3px 6px;
      text-align: right;
      white-space: nowrap;
    }
    tr.summary-row td:first-child { text-align: left; }
    tr.summary-row td:last-child  { text-align: center; }

    /* ── 편집 행 ── */
    tr.edit-row td {
      background-color: #FFFDE7;
      border: 1px solid #D0D0D0;
      padding: 3px 6px;
    }
    tr.edit-row input {
      font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      font-size: 12px;
      border: 1px solid #B0B0B0;
      padding: 1px 4px;
      width: 100%;
      text-align: right;
      background-color: #FFFFFF;
    }
    tr.edit-row input:focus { outline: 1px solid #888888; }

    /* ── 편집 버튼 그룹 ── */
    .edit-btn-group {
      display: flex;
      gap: 3px;
      justify-content: center;
      white-space: nowrap;
    }
    .edit-btn-group button {
      font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      font-size: 11px;
      padding: 1px 6px;
      cursor: pointer;
      border: 1px solid #B0B0B0;
      background: none;
      color: #333333;
    }
    .edit-btn-group button:hover { background-color: #F2F2F2; }
    .edit-btn-group button.btn-delete { color: #C51F2A; border-color: #C51F2A; }
    .edit-btn-group button.btn-delete:hover { background-color: #FFF0F0; }

    /* ── 행별 Edit 버튼 ── */
    .btn-row-edit {
      font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      font-size: 11px;
      padding: 1px 6px;
      cursor: pointer;
      border: 1px solid #B0B0B0;
      background: none;
      color: #333333;
    }
    .btn-row-edit:hover:not(:disabled) { background-color: #F2F2F2; }
    .btn-row-edit:disabled { color: #B0B0B0; border-color: #D0D0D0; cursor: default; }

    /* ── 하단 바 ── */
    #bottom-bar {
      margin-top: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #btn-add {
      background: none;
      border: 1px solid #B0B0B0;
      color: #444444;
      font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      font-size: 12px;
      padding: 3px 10px;
      cursor: pointer;
    }
    #btn-add:hover { background-color: #F2F2F2; }

    #right-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #last-updated { font-size: 11px; color: #999999; }
    #btn-refresh {
      background: none;
      border: none;
      color: #CCCCCC;
      font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      font-size: 11px;
      cursor: pointer;
      padding: 2px 2px;
      letter-spacing: -0.5px;
    }
    #btn-refresh:hover { color: #888888; }
  </style>
</head>
<body>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Code</th>
        <th>Current</th>
        <th>Change</th>
        <th>Avg.Cost</th>
        <th>Qty</th>
        <th>Buy.Cost</th><!-- [3] 추가 -->
        <th>Value</th>
        <th>P&amp;L</th>
        <th>Return</th>
        <th>Edit</th>
      </tr>
    </thead>
    <tbody id="summary-body"></tbody>
    <tbody id="holdings-body"></tbody>
  </table>

  <div id="bottom-bar">
    <div id="btn-add-wrap">
      <button id="btn-add">Add</button><!-- [1] 텍스트 변경 -->
    </div>
    <div id="right-controls">
      <span id="last-updated"></span>
      <button id="btn-refresh">↻ 조회</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'stock_monitor_holdings';
    const MAX_HOLDINGS = 10;

    let holdings    = [];
    let editingIndex = null;
    // code → {itemName, price, diff, diffRate} | null(조회실패) | undefined(미조회)
    let priceData   = {};

    // ── 저장/복원 ─────────────────────────────────────────────
    function saveHoldings() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(holdings));
    }

    function loadHoldings() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        holdings = raw ? JSON.parse(raw) : [];
      } catch (e) {
        holdings = [];
      }
    }

    // ── 포맷 함수 ─────────────────────────────────────────────
    function formatNumber(n) {
      return Math.round(n).toLocaleString('ko-KR');
    }

    function formatDiff(diff, rate) {
      const s = diff >= 0 ? '+' : '';
      return s + formatNumber(diff) + ' (' + s + rate.toFixed(2) + '%)';
    }

    function formatPnL(n) {
      return (n >= 0 ? '+' : '') + formatNumber(n);
    }

    function formatRate(r) {
      return (r >= 0 ? '+' : '') + r.toFixed(2) + '%';
    }

    function getPnlColor(v) {
      if (v > 0) return '#C51F2A';
      if (v < 0) return '#002452';
      return '#000000';
    }

    // ── 현재가 조회 ───────────────────────────────────────────
    async function fetchPrice(code) {
      const url = 'https://corsproxy.io/?https://query1.finance.yahoo.com/v8/finance/chart/' + code + '.KS';
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error('http ' + res.status);
        const json = await res.json();
        const meta = json.chart.result[0].meta;
        const price     = meta.regularMarketPrice;
        const prevClose = meta.previousClose;
        const diff      = price - prevClose;
        const diffRate  = diff / prevClose * 100;
        const itemName  = meta.longName || meta.shortName || code;
        return { itemName, price, diff, diffRate };
      } catch (e) {
        return null;
      }
    }

    async function fetchAll() {
      for (let i = 0; i < holdings.length; i++) {
        const code = holdings[i].code;
        priceData[code] = await fetchPrice(code); // null on failure
        renderTable();
      }
      const now = new Date();
      document.getElementById('last-updated').textContent =
        String(now.getHours()).padStart(2,'0') + ':' +
        String(now.getMinutes()).padStart(2,'0') + ':' +
        String(now.getSeconds()).padStart(2,'0') + ' 기준';
    }

    // ── 렌더링 ────────────────────────────────────────────────
    function renderSummary() {
      // 총 매입금액: 현재가 불필요, 항상 계산
      const totalCost = holdings.reduce(function(acc, h) {
        return acc + h.avgPrice * h.quantity;
      }, 0);

      // 총 평가금액: 조회된 종목만 합산
      let totalValue   = 0;
      let valueCovered = 0;
      holdings.forEach(function(h) {
        const pd = priceData[h.code];
        if (pd) { totalValue += pd.price * h.quantity; valueCovered++; }
      });

      const allPriced = holdings.length > 0 && valueCovered === holdings.length;

      const costText  = totalCost > 0 ? formatNumber(totalCost) : '';
      const valueText = valueCovered > 0 ? formatNumber(totalValue) : '';

      let pnlText = '', pnlColor = '#000000', returnText = '';
      if (allPriced && totalCost > 0) {
        const pnl = totalValue - totalCost;
        pnlColor   = getPnlColor(pnl);
        pnlText    = formatPnL(pnl);
        returnText = formatRate(pnl / totalCost * 100);
      }

      // 열 순서(11개): Name / Code / Current / Change / Avg.Cost(공란) / Qty / Buy.Cost / Value / P&L / Return / Edit
      const html =
        '<tr class="summary-row">' +
          '<td></td>' +
          '<td></td>' +
          '<td></td>' +
          '<td></td>' +
          '<td></td>' +
          '<td></td>' +
          '<td style="color:#000000">' + costText  + '</td>' +
          '<td style="color:#000000">' + valueText + '</td>' +
          '<td style="color:' + pnlColor + '">' + pnlText    + '</td>' +
          '<td style="color:' + pnlColor + '">' + returnText + '</td>' +
          '<td></td>' +
        '</tr>';

      document.getElementById('summary-body').innerHTML = html;
    }

    // [3] makeEditRow: 11열 (Buy.Cost 위치에 빈 td 추가)
    function makeEditRow(code, qty, avgCost, isNew) {
      const tr = document.createElement('tr');
      tr.className = 'edit-row';
      const deleteBtn = isNew ? '' : '<button class="btn-delete" onclick="handleDelete()">Delete</button>';
      tr.innerHTML =
        '<td></td>' +
        '<td><input id="edit-code" type="text"   maxlength="6" value="' + (code   || '') + '" placeholder="종목코드"></td>' +
        '<td style="text-align:right;color:#999999">-</td>' +
        '<td style="text-align:right;color:#999999">-</td>' +
        '<td><input id="edit-cost" type="number" min="1"       value="' + (avgCost|| '') + '" placeholder="평균단가"></td>' +
        '<td><input id="edit-qty"  type="number" min="1"       value="' + (qty    || '') + '" placeholder="수량"></td>' +
        '<td></td>' +                                                      // Buy.Cost 빈 td
        '<td></td>' +
        '<td></td>' +
        '<td></td>' +
        '<td><div class="edit-btn-group">' +
          '<button onclick="handleSave()">Save</button>' +
          '<button onclick="handleCancel()">Cancel</button>' +
          deleteBtn +
        '</div></td>';
      return tr;
    }

    function renderRows() {
      const tbody    = document.getElementById('holdings-body');
      tbody.innerHTML = '';
      const isEditing = editingIndex !== null;

      holdings.forEach(function(h, idx) {
        if (editingIndex === idx) {
          tbody.appendChild(makeEditRow(h.code, h.quantity, h.avgPrice, false));
          return;
        }

        const pd  = priceData[h.code];
        const dis = isEditing ? ' disabled' : '';

        // 기본값
        let nameText   = '';
        let curText    = '-', curColor  = '#000000';
        let diffText   = '-', diffColor = '#000000';
        let valueText  = '';
        let pnlText    = '', pnlColor   = '#000000';
        let returnText = '';

        if (pd === null) {
          curText  = '조회불가';
          curColor = '#999999';
          diffText = '';
        } else if (pd !== undefined) {
          nameText  = pd.itemName;
          curText   = formatNumber(pd.price);
          curColor  = getPnlColor(pd.diff);
          diffText  = formatDiff(pd.diff, pd.diffRate);
          diffColor = getPnlColor(pd.diff);

          const cost  = h.avgPrice * h.quantity;
          const value = pd.price   * h.quantity;
          const pnl   = value - cost;
          valueText  = formatNumber(value);
          pnlText    = formatPnL(pnl);
          pnlColor   = getPnlColor(pnl);
          returnText = formatRate(pnl / cost * 100);
        }

        // Buy.Cost = Avg.Cost × Qty, 항상 표시
        const buyCostText = formatNumber(h.avgPrice * h.quantity);

        const editBtn =
          '<td style="text-align:center">' +
            '<button class="btn-row-edit"' + dis + ' onclick="startEdit(' + idx + ')">Edit</button>' +
          '</td>';

        const tr = document.createElement('tr');
        tr.innerHTML =
          '<td>' + nameText + '</td>' +
          '<td>' + h.code  + '</td>' +
          '<td style="color:' + curColor  + '">' + curText    + '</td>' +
          '<td style="color:' + diffColor + '">' + diffText   + '</td>' +
          '<td style="color:#000000">' + formatNumber(h.avgPrice) + '</td>' +
          '<td style="color:#000000">' + formatNumber(h.quantity) + '</td>' +
          '<td style="color:#000000">' + buyCostText + '</td>' +
          '<td style="color:#000000">' + valueText   + '</td>' +
          '<td style="color:' + pnlColor + '">' + pnlText    + '</td>' +
          '<td style="color:' + pnlColor + '">' + returnText + '</td>' +
          editBtn;
        tbody.appendChild(tr);
      });

      if (editingIndex === 'new') {
        tbody.appendChild(makeEditRow('', '', '', true));
      }
    }

    function renderAddButton() {
      document.getElementById('btn-add-wrap').style.display =
        (editingIndex === null && holdings.length < MAX_HOLDINGS) ? '' : 'none';
    }

    function renderTable() {
      renderSummary();
      renderRows();
      renderAddButton();
    }

    // ── 편집 핸들러 ───────────────────────────────────────────
    function startEdit(idx) {
      if (editingIndex !== null) return;
      editingIndex = idx;
      renderTable();
      const el = document.getElementById('edit-code');
      if (el) el.focus();
    }

    function handleSave() {
      const codeEl = document.getElementById('edit-code');
      const costEl = document.getElementById('edit-cost');
      const qtyEl  = document.getElementById('edit-qty');
      const code    = codeEl.value.trim();
      const avgCost = parseInt(costEl.value, 10);
      const qty     = parseInt(qtyEl.value,  10);

      if (!code || isNaN(avgCost) || avgCost <= 0 || isNaN(qty) || qty <= 0) {
        codeEl.focus();
        return;
      }

      if (editingIndex === 'new') {
        holdings.push({ code, quantity: qty, avgPrice: avgCost });
      } else {
        holdings[editingIndex] = { code, quantity: qty, avgPrice: avgCost };
      }
      editingIndex = null;
      saveHoldings();
      renderTable();
    }

    function handleCancel() {
      editingIndex = null;
      renderTable();
    }

    function handleDelete() {
      if (typeof editingIndex !== 'number') return;
      holdings.splice(editingIndex, 1);
      editingIndex = null;
      saveHoldings();
      renderTable();
    }

    // ── 이벤트 ────────────────────────────────────────────────
    document.getElementById('btn-add').addEventListener('click', function() {
      if (editingIndex !== null || holdings.length >= MAX_HOLDINGS) return;
      editingIndex = 'new';
      renderTable();
      const el = document.getElementById('edit-code');
      if (el) el.focus();
    });

    document.getElementById('btn-refresh').addEventListener('click', async function() {
      if (holdings.length === 0) return;
      const btn = document.getElementById('btn-refresh');
      btn.textContent = '↻ 조회중...';
      await fetchAll();
      btn.textContent = '↻ 조회';
    });

    // ── 초기화 ────────────────────────────────────────────────
    loadHoldings();
    renderTable();
    if (holdings.length > 0) fetchAll();
  </script>
</body>
</html>
